SCRUMBOARD -> BOARDS -> LIST -> CARD

<div class="flex flex-col p-4 shadow rounded-lg bg-card">
    <!-- Título y estado -->
    <div class="flex items-center justify-between mb-2">
        <span class="font-medium">{{card.nombreSolicitante}}</span>
        <span class="px-2 py-1 rounded text-xs" 
              [ngClass]="{
                'bg-green-100 text-green-800': card.estado === EstadoServicio.TERMINADO,
                'bg-yellow-100 text-yellow-800': card.estado === EstadoServicio.EN_PROGRESO,
                'bg-red-100 text-red-800': card.estado === EstadoServicio.PENDIENTE,
                'bg-gray-100 text-gray-800': card.estado === EstadoServicio.SIN_ASIGNAR
              }">
            {{card.estado}}
        </span>
    </div>

    <!-- Detalles -->
    <div class="space-y-2">
        <!-- Problema -->
        <div class="text-sm" *ngIf="card.problema">
            {{card.problema}}
        </div>

        <!-- Oficina Solicitante -->
        <div class="flex items-center text-sm" *ngIf="card.oficinaSolicitante">
            <mat-icon class="icon-size-4 mr-1">business</mat-icon>
            <span>{{card.oficinaSolicitante}}</span>
        </div>

        <!-- Teléfono Solicitante -->
        <div class="flex items-center text-sm" *ngIf="card.telefonoSolicitante">
            <mat-icon class="icon-size-4 mr-1">phone</mat-icon>
            <span>{{card.telefonoSolicitante}}</span>
        </div>
    </div>
</div>
